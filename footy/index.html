<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOOTY 足球交友</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#07C160;--bg:#EDEDED;--card:#fff;--text:#191919;--muted:#888;--line:#E5E5E5}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#F7F7F7;position:relative;padding-bottom:96px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px;letter-spacing:2px}
header h1 span{color:var(--green)}
.sync{font-size:11px;color:#0B7A43;background:#E6F7EE;border:1px solid #9BE3BC;border-radius:20px;padding:4px 8px}
main{padding:16px 16px 12px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin-bottom:12px}
h3{font-size:14px;margin:12px 0 6px}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid #DDD;border-radius:8px;padding:10px;font-size:15px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:84px}
button{border:none;border-radius:8px;padding:11px 16px;font-size:15px;cursor:pointer}
.btn-primary{background:var(--green);color:#fff;width:100%}
.btn-ghost{background:#F0F0F0;color:#333}
.btn-small{padding:7px 12px;font-size:13px;width:auto}
.row{display:flex;gap:8px}
.row>*{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid #DDD;background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none}
.post{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #F0F0F0}
.post:last-child{border-bottom:none}
.post-body{flex:1;min-width:0}
.post-head{display:flex;justify-content:space-between;align-items:baseline}
.post-name{font-weight:700;font-size:15px}
.post-meta{font-size:12px;color:var(--muted);margin-top:2px}
.post-text{font-size:15px;line-height:1.6;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:12px;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:1px 6px;margin-right:6px}
.actions{display:flex;gap:16px;margin-top:6px}
.actions button{background:none;padding:0;font-size:13px;color:#666}
.actions button.liked{color:#E64340}
.comments{margin-top:8px;background:#F7F7F7;border-radius:8px;padding:8px 10px}
.comment{font-size:13px;line-height:1.5;padding:3px 0}
.comment b{margin-right:4px}
.comment-box{display:flex;gap:6px;margin-top:8px}
.comment-box input{flex:1;padding:8px}
.comment-box button{padding:8px 12px}
.friend{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #F0F0F0}
.friend:last-child{border-bottom:none}
.friend-info{flex:1;min-width:0}
.friend-name{font-weight:700}
.friend-meta{font-size:12px;color:var(--muted);margin:3px 0;line-height:1.5}
.friend-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.friend-actions select{width:auto;padding:6px;font-size:13px}
.msg{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #F0F0F0}
.msg:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;background:#FA5151;display:inline-block;margin-left:4px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 12px;line-height:1.8}
.profile-top{display:flex;gap:12px;align-items:center}
.profile-top .name{font-size:19px;font-weight:700}
.kv{display:grid;grid-template-columns:86px 1fr;gap:6px 8px;font-size:14px;margin-top:12px}
.kv b{color:#666;font-weight:500}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#F7F7F7;border-top:1px solid #D9D9D9;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;font-size:11px;color:#191919;position:relative;border-radius:0}
nav button.on{color:var(--green)}
nav .ic{font-size:22px;line-height:1}
.badge{position:absolute;top:2px;left:calc(50% + 4px);background:#FA5151;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.hidden{display:none!important}
.note{background:#FFF7E0;border:1px solid #FFE08A;border-radius:8px;padding:10px;font-size:13px;line-height:1.6;color:#7A5200;margin-bottom:12px}
.note-green{background:#E6F7EE;border:1px solid #9BE3BC;border-radius:8px;padding:10px;font-size:13px;line-height:1.6;color:#0B7A43;margin-bottom:12px}
.authmsg{border-radius:8px;padding:10px;font-size:13px;line-height:1.6;margin-bottom:10px}
.authmsg.err{background:#FDECEA;color:#B3261E}
.authmsg.ok{background:#E6F7EE;color:#0B7A43}
.danger{color:#E64340;background:none;padding:0;font-size:13px;text-align:left}
.tabs-auth{display:flex;gap:8px;margin-bottom:6px}
.tabs-auth button{flex:1;background:#F0F0F0;color:#333}
.tabs-auth button.on{background:var(--green);color:#fff}
</style>
</head>
<body>
<div class="app">
<header><h1>FOOTY</h1><span class="sync" id="syncPill">☁️ 已同步</span></header>
<main id="main"><div class="card"><p class="muted">加载中…</p></div></main>
<nav id="nav" class="hidden">
  <button data-tab="messages"><span class="ic">💬</span>消息<span class="badge hidden" id="badgeMsg">0</span></button>
  <button data-tab="friends"><span class="ic">👥</span>球友</button>
  <button data-tab="discover"><span class="ic">🧭</span>发现</button>
  <button data-tab="me"><span class="ic">👤</span>我</button>
</nav>
</div>
<script>
"use strict";
/* FOOTY 接 Supabase 免费数据库（项目 footy，新加坡）。
   账号走 Supabase Auth 真验证：注册发验证邮件，点链接后才能登录；
   登录密码和服务器核对，没注册过、随便编的邮箱都进不去。
   主页、动态、评论、点赞、球友、打招呼、消息全部存在 Supabase 六张表里。 */
var SB_URL="https://mjobujylsskecudrfqrj.supabase.co";
var SB_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qb2J1anlsc3NrZWN1ZHJmcXJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNjUwNDUsImV4cCI6MjEwOTY0MTA0NX0.IkZhKB0DNDM3aN0d3KBze6EtAZqSrgD-60OXQ5N4cdw";
var sb=null;
if(window.supabase&&window.supabase.createClient){sb=window.supabase.createClient(SB_URL,SB_ANON_KEY);}
function uid(){try{return crypto.randomUUID()}catch(e){return "id_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nowStr(ts){var d=new Date(ts);if(isNaN(d))return "";return (d.getMonth()+1)+"月"+d.getDate()+"日 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function avatarChar(name){return (name||"球").trim().charAt(0)||"球"}
function seenKey(){return sbUser?("footy_seen_"+sbUser.id):"footy_seen_none"}
function getSeen(){try{return Number(localStorage.getItem(seenKey())||0)}catch(e){return 0}}
function setSeen(v){try{localStorage.setItem(seenKey(),String(v))}catch(e){}}

var sbUser=null, myProfile=null;
var D={profiles:[],posts:[],comments:[],likes:[],friends:[],greetings:[]};
var dataLoaded=false, dataError="";
var tab="discover", discoverCat="全部", friendQ="", friendCity="全部", friendPos="全部";

function me(){return myProfile}
function profileById(id){return D.profiles.find(function(p){return p.id===id})||null}
function unreadCount(){
  if(!myProfile)return 0;var seen=getSeen();var n=0;
  D.greetings.forEach(function(g){if(g.to_id===myProfile.id&&!g.read)n++});
  var myPostIds=D.posts.filter(function(p){return p.author_id===myProfile.id}).map(function(p){return p.id});
  D.likes.forEach(function(l){if(myPostIds.indexOf(l.post_id)>=0&&l.user_id!==myProfile.id&&new Date(l.created_at).getTime()>seen)n++});
  D.comments.forEach(function(c){if(myPostIds.indexOf(c.post_id)>=0&&c.author_id!==myProfile.id&&new Date(c.created_at).getTime()>seen)n++});
  return n;
}
function updateBadge(){var n=unreadCount();var b=document.getElementById("badgeMsg");if(!b)return;if(n>0){b.textContent=n>99?"99+":n;b.classList.remove("hidden")}else{b.classList.add("hidden")}}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
document.querySelectorAll("#nav button").forEach(function(b){b.addEventListener("click",function(){setTab(b.dataset.tab)})});

async function loadAll(){
  var r=await Promise.all([
    sb.from("profiles").select("*").order("created_at",{ascending:true}),
    sb.from("posts").select("*").order("created_at",{ascending:false}),
    sb.from("comments").select("*").order("created_at",{ascending:true}),
    sb.from("likes").select("*"),
    sb.from("friends").select("*"),
    sb.from("greetings").select("*").order("created_at",{ascending:false})
  ]);
  var names=["profiles","posts","comments","likes","friends","greetings"];
  for(var i=0;i<r.length;i++){
    if(r[i].error){dataError="读取失败，请刷新重试。";throw new Error(dataError)}
    D[names[i]]=r[i].data||[];
  }
  dataLoaded=true;dataError="";
}
async function ensureProfile(){
  var res=await sb.from("profiles").select("*").eq("id",sbUser.id).maybeSingle();
  if(res.error)throw new Error("加载失败，请刷新重试。");
  if(res.data){myProfile=res.data;return}
  var nick=(sbUser.user_metadata&&sbUser.user_metadata.nickname)||"球友";
  var ins=await sb.from("profiles").insert({id:sbUser.id,nickname:nick,city:"",position:"",level:"",team:"",bio:"",style:"",free_time:""}).select().single();
  if(ins.error)throw new Error("加载失败，请刷新重试。");
  myProfile=ins.data;
}
function authErrText(err){
  var m=(err&&err.message)||"出错了";
  if(/email not confirmed/i.test(m))return "邮箱未验证，去邮箱点验证链接。";
  if(/invalid login credentials/i.test(m))return "邮箱或密码不对。";
  if(/user already registered/i.test(m))return "该邮箱已注册，请直接登录。";
  if(/email rate limit|over_email_send_rate_limit|rate limit/i.test(m))return "发送太频繁，稍后再试。";
  if(/invalid.*email/i.test(m))return "邮箱格式不对。";
  if(/password/i.test(m)&&/short|least|6/i.test(m))return "密码至少 6 位。";
  return "出错了，请重试。";
}
function viewAuth(){
  var mode=window._authMode||"register";
  var msg=window._authMsg||null;
  var html='<div class="card"><h2>FOOTY</h2><p class="muted">找球友，一起踢球。</p>';
  if(!sb)html+='<div class="authmsg err">网络异常，请刷新重试。</div>';
  if(msg)html+='<div class="authmsg '+msg.kind+'">'+esc(msg.text)+'</div>';
  html+='<div class="tabs-auth"><button class="'+(mode==="register"?"on":"")+'" onclick="window._authMode=\'register\';window._authMsg=null;render()">注册</button><button class="'+(mode==="login"?"on":"")+'" onclick="window._authMode=\'login\';window._authMsg=null;render()">登录</button></div>';
  if(mode==="register"){
    html+='<input id="a_nick" placeholder="昵称，如：阿杰"><input id="a_email" type="email" placeholder="邮箱，要能收到验证邮件" style="margin-top:10px"><input id="a_pw" type="password" placeholder="密码，至少 6 位" style="margin-top:10px"><div style="height:12px"></div><button class="btn-primary" onclick="doRegister()">注册</button>'
    +'<p class="muted" style="margin-top:12px">注册后去邮箱点验证链接，再回来登录。</p>';
  }else{
    html+='<input id="a_email" type="email" placeholder="邮箱"><input id="a_pw" type="password" placeholder="密码" style="margin-top:10px"><div style="height:12px"></div><button class="btn-primary" onclick="doLogin()">登录</button>'
    ;
  }
  html+='</div><p class="muted" style="text-align:center;padding:4px 0 8px">主页 · 动态 · 球友 · 消息</p>';
  return html;
}
async function doRegister(){
  if(!sb){alert("网络异常，请刷新重试");return}
  var nick=document.getElementById("a_nick").value.trim();
  var email=document.getElementById("a_email").value.trim().toLowerCase();
  var pw=document.getElementById("a_pw").value;
  if(!nick){alert("请填昵称");return}
  if(!email||email.indexOf("@")<0){alert("邮箱不对");return}
  if(!pw||pw.length<6){alert("密码至少 6 位");return}
  var res=await sb.auth.signUp({email:email,password:pw,options:{data:{nickname:nick}}});
  if(res.error){window._authMsg={kind:"err",text:authErrText(res.error)};render();return}
  if(res.data&&res.data.session){sbUser=res.data.session.user;await afterLogin();return}
  window._authMode="login";
  window._authMsg={kind:"ok",text:"验证邮件已发到 "+email+"，去邮箱点链接后再登录。"};
  render();
}
async function doLogin(){
  if(!sb){alert("网络异常，请刷新重试");return}
  var email=document.getElementById("a_email").value.trim().toLowerCase();
  var pw=document.getElementById("a_pw").value;
  if(!email||!pw){alert("请填邮箱和密码");return}
  var res=await sb.auth.signInWithPassword({email:email,password:pw});
  if(res.error){window._authMsg={kind:"err",text:authErrText(res.error)};render();return}
  sbUser=res.data.user;await afterLogin();
}
async function afterLogin(){
  window._authMsg=null;
  try{await ensureProfile();await loadAll();}
  catch(e){window._authMsg={kind:"err",text:e.message};sbUser=null;myProfile=null;render();return}
  tab="discover";render();
}
async function logout(){if(sb){await sb.auth.signOut()}sbUser=null;myProfile=null;dataLoaded=false;tab="discover";render()}

function viewDiscover(){
  var m=me();
  var cats=["全部","约球","日常","观赛"];
  var html='';
  html+='<div class="card"><div class="chips">'+cats.map(function(c){return '<span class="chip'+(discoverCat===c?" on":"")+'" onclick="discoverCat=\''+c+'\';render()">'+c+'</span>'}).join("")+'</div>'
  +'<textarea id="p_text" placeholder="想约球？写时间、地点、缺几个人……"></textarea>'
  +'<div class="row" style="margin-top:8px"><select id="p_cat"><option>约球</option><option>日常</option><option>观赛</option></select><button class="btn-primary" onclick="doPost()">发布</button></div></div>';
  var posts=D.posts.slice();
  if(discoverCat!=="全部")posts=posts.filter(function(p){return p.category===discoverCat});
  html+='<div class="card"><h2>动态</h2>';
  if(!posts.length){html+='<div class="empty">还没有动态，发第一条吧</div>'}
  posts.forEach(function(p){
    var u=profileById(p.author_id)||{nickname:p.author_nickname||"球友",city:"",position:"",level:""};
    var likes=D.likes.filter(function(l){return l.post_id===p.id});
    var liked=m&&likes.some(function(l){return l.user_id===m.id});
    var comments=D.comments.filter(function(c){return c.post_id===p.id});
    html+='<div class="post"><div class="avatar">'+esc(avatarChar(u.nickname))+'</div><div class="post-body">'
    +'<div class="post-head"><span class="post-name">'+esc(u.nickname)+'</span><span class="muted" style="font-size:12px">'+nowStr(p.created_at)+'</span></div>'
    +'<div class="post-meta">'+esc([u.city,u.position,u.level].filter(Boolean).join(" · ")||"球友")+'</div>'
    +'<div class="post-text"><span class="tag">'+esc(p.category)+'</span>'+esc(p.content)+'</div>'
    +'<div class="actions"><button class="'+(liked?"liked":"")+'" onclick="toggleLike(\''+p.id+'\')">👍 '+likes.length+'</button><button onclick="document.getElementById(\'c_'+p.id+'\').focus()">💬 '+comments.length+'</button>'
    +(m&&p.author_id===m.id?'<button onclick="deletePost(\''+p.id+'\')">删</button>':"")+'</div>';
    if(comments.length){
      html+='<div class="comments">'+comments.map(function(c){var cu=profileById(c.author_id)||{nickname:c.author_nickname||"球友"};return '<div class="comment"><b>'+esc(cu.nickname)+'</b>'+esc(c.content)+'</div>'}).join("")+'</div>';
    }
    html+='<div class="comment-box"><input id="c_'+p.id+'" placeholder="写评论…"><button class="btn-primary btn-small" onclick="doComment(\''+p.id+'\')">发送</button></div>';
    html+='</div></div>';
  });
  html+='</div>';return html;
}
async function doPost(){
  var m=me();if(!m)return;var t=document.getElementById("p_text").value.trim();if(!t){alert("先写点内容");return}
  var cat=document.getElementById("p_cat").value;
  var res=await sb.from("posts").insert({id:uid(),author_id:m.id,author_nickname:m.nickname,category:cat,content:t});
  if(res.error){alert("发布失败，请重试。");return}
  await loadAll();render();
}
async function toggleLike(postId){
  var m=me();if(!m)return;
  var ex=D.likes.find(function(l){return l.post_id===postId&&l.user_id===m.id});
  if(ex){await sb.from("likes").delete().eq("id",ex.id)}
  else{await sb.from("likes").insert({id:uid(),post_id:postId,user_id:m.id})}
  var n=D.likes.filter(function(l){return l.post_id===postId}).length+(ex?-1:1);
  await sb.from("posts").update({likes:Math.max(0,n)}).eq("id",postId);
  await loadAll();render();
}
async function doComment(postId){
  var m=me();if(!m)return;var inp=document.getElementById("c_"+postId);var t=inp.value.trim();if(!t)return;
  var res=await sb.from("comments").insert({id:uid(),post_id:postId,author_id:m.id,author_nickname:m.nickname,content:t});
  if(res.error){alert("评论失败，请重试。");return}
  await loadAll();render();
}
async function deletePost(postId){
  if(!confirm("删除这条动态？"))return;
  await sb.from("comments").delete().eq("post_id",postId);
  await sb.from("likes").delete().eq("post_id",postId);
  var res=await sb.from("posts").delete().eq("id",postId);
  if(res.error){alert("删除失败，请重试。");return}
  await loadAll();render();
}
function viewFriends(){
  var m=me();var users=D.profiles.filter(function(u){return u.id!==m.id});
  var cities=["全部"].concat(Array.from(new Set(users.map(function(u){return u.city}).filter(Boolean))));
  var poss=["全部","前锋","中场","后卫","门将"];
  var list=users.filter(function(u){
    if(friendQ&&u.nickname.indexOf(friendQ)<0&&(u.city||"").indexOf(friendQ)<0&&(u.team||"").indexOf(friendQ)<0)return false;
    if(friendCity!=="全部"&&u.city!==friendCity)return false;
    if(friendPos!=="全部"&&u.position!==friendPos)return false;
    return true;
  });
  var html='<div class="card"><h2>找球友</h2><input id="f_q" placeholder="搜昵称 / 城市 / 主队" value="'+esc(friendQ)+'" oninput="friendQ=this.value;renderFriendsOnly()">'
  +'<div class="row" style="margin-top:8px"><select id="f_city" onchange="friendCity=this.value;render()">'+cities.map(function(c){return '<option'+(friendCity===c?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select>'
  +'<select id="f_pos" onchange="friendPos=this.value;render()">'+poss.map(function(c){return '<option'+(friendPos===c?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select></div>'
  +'<p class="muted" style="margin-top:8px">共 '+list.length+' 位球友</p></div>';
  html+='<div class="card"><h2>球友</h2>';
  if(!list.length){html+='<div class="empty">还没有球友</div>'}
  list.forEach(function(u){
    var rel=D.friends.find(function(f){return f.user_id===m.id&&f.friend_id===u.id});
    var greeted=D.greetings.some(function(g){return g.from_id===m.id&&g.to_id===u.id});
    html+='<div class="friend"><div class="avatar">'+esc(avatarChar(u.nickname))+'</div><div class="friend-info">'
    +'<div class="friend-name">'+esc(u.nickname)+'</div>'
    +'<div class="friend-meta">'+esc([u.city,u.position,u.level,u.team].filter(Boolean).join(" · ")||"还没填资料")+'<br>'+esc(u.bio||"暂无简介")+'</div>'
    +'<div class="friend-actions"><select onchange="setFriendStatus(\''+u.id+'\',this.value)">'
    +["想认识","已打招呼","常一起踢"].map(function(s){return '<option'+(rel&&rel.status===s?" selected":"")+'>'+s+'</option>'}).join("")+'</select>'
    +'<button class="btn-primary btn-small" onclick="greet(\''+u.id+'\')">'+(greeted?"已打招呼":"打招呼")+'</button>'
    +'<button class="btn-ghost btn-small" onclick="viewProfile(\''+u.id+'\')">看主页</button></div></div></div>';
  });
  html+='</div>';return html;
}
function renderFriendsOnly(){var v=document.getElementById("f_q");var pos=v?v.selectionStart:0;render();var nv=document.getElementById("f_q");if(nv){nv.focus();nv.setSelectionRange(pos,pos)}}
async function setFriendStatus(toId,status){
  var m=me();
  var ex=D.friends.find(function(x){return x.user_id===m.id&&x.friend_id===toId});
  if(ex){await sb.from("friends").update({status:status}).eq("id",ex.id)}
  else{await sb.from("friends").insert({id:uid(),user_id:m.id,friend_id:toId,status:status})}
  await loadAll();render();
}
async function greet(toId){
  var m=me();
  if(D.greetings.some(function(g){return g.from_id===m.id&&g.to_id===toId})){alert("已打过招呼");return}
  var res=await sb.from("greetings").insert({id:uid(),from_id:m.id,from_nickname:m.nickname,to_id:toId,message:"你好，我是 "+m.nickname+"，有空一起踢球吗？",read:false});
  if(res.error){alert("打招呼失败，请重试。");return}
  var f=D.friends.find(function(x){return x.user_id===m.id&&x.friend_id===toId});
  if(f){await sb.from("friends").update({status:"已打招呼"}).eq("id",f.id)}
  else{await sb.from("friends").insert({id:uid(),user_id:m.id,friend_id:toId,status:"已打招呼"})}
  await loadAll();alert("已打招呼");render();
}
function viewProfile(userId){
  var u=profileById(userId);if(!u)return;
  var posts=D.posts.filter(function(p){return p.author_id===userId});
  alert("\n城市："+(u.city||"—")+"\n位置："+(u.position||"—")+"\n水平："+(u.level||"—")+"\n主队："+(u.team||"—")+"\n简介："+(u.bio||"—")+"\n踢法："+(u.style||"—")+"\n常有空："+(u.free_time||"—")+"\n动态："+posts.length+" 条");
}
function viewMessages(){
  var m=me();
  var items=[];
  D.greetings.forEach(function(g){if(g.to_id===m.id){var f=profileById(g.from_id)||{nickname:g.from_nickname||"球友"};items.push({ts:g.created_at,who:f.nickname,text:g.message,kind:"打招呼",unread:!g.read})}});
  var myPostIds=D.posts.filter(function(p){return p.author_id===m.id}).map(function(p){return p.id});
  D.likes.forEach(function(l){if(myPostIds.indexOf(l.post_id)>=0&&l.user_id!==m.id){var u=profileById(l.user_id)||{nickname:"球友"};items.push({ts:l.created_at,who:u.nickname,text:"赞了你的动态",kind:"点赞",unread:new Date(l.created_at).getTime()>getSeen()})}});
  D.comments.forEach(function(c){if(myPostIds.indexOf(c.post_id)>=0&&c.author_id!==m.id){var u=profileById(c.author_id)||{nickname:c.author_nickname||"球友"};items.push({ts:c.created_at,who:u.nickname,text:"评论："+c.content,kind:"评论",unread:new Date(c.created_at).getTime()>getSeen()})}});
  items.sort(function(a,b){return new Date(b.ts)-new Date(a.ts)});
  var html='<div class="card"><h2>消息</h2><button class="btn-ghost btn-small" onclick="markRead()">全部已读</button>';
  if(!items.length){html+='<div class="empty">还没有消息</div>'}
  items.forEach(function(it){
    html+='<div class="msg"><div class="avatar">'+esc(avatarChar(it.who))+'</div><div class="post-body"><div class="post-head"><span class="post-name">'+esc(it.who)+(it.unread?'<span class="dot"></span>':"")+'</span><span class="muted" style="font-size:12px">'+nowStr(it.ts)+'</span></div><div class="post-meta">'+esc(it.kind)+'</div><div class="post-text" style="margin:4px 0 0">'+esc(it.text)+'</div></div></div>';
  });
  html+='</div>';return html;
}
async function markRead(){
  var m=me();if(!m)return;
  await sb.from("greetings").update({read:true}).eq("to_id",m.id).eq("read",false);
  setSeen(Date.now());
  await loadAll();render();
}
function viewMe(){
  var m=me();
  var email=sbUser?sbUser.email:"";
  var html='<div class="card"><div class="profile-top"><div class="avatar" style="width:64px;height:64px;font-size:28px">'+esc(avatarChar(m.nickname))+'</div><div><div class="name">'+esc(m.nickname)+'</div><div class="muted">'+esc(email)+'</div></div></div>'
  +'<div class="kv"><b>城市</b><span>'+esc(m.city||"—")+'</span><b>位置</b><span>'+esc(m.position||"—")+'</span><b>水平</b><span>'+esc(m.level||"—")+'</span><b>主队</b><span>'+esc(m.team||"—")+'</span><b>简介</b><span>'+esc(m.bio||"—")+'</span><b>踢法</b><span>'+esc(m.style||"—")+'</span><b>常有空</b><span>'+esc(m.free_time||"—")+'</span></div></div>';
  html+='<div class="card"><h2>编辑资料</h2>'
  +'<input id="e_nick" placeholder="昵称" value="'+esc(m.nickname)+'">'
  +'<input id="e_city" placeholder="城市，如：西安" value="'+esc(m.city||"")+'" style="margin-top:10px">'
  +'<div class="row"><div><select id="e_pos" style="margin-top:10px">'+["","前锋","中场","后卫","门将"].map(function(p){return '<option value="'+p+'"'+(m.position===p?" selected":"")+'>'+(p||"位置")+'</option>'}).join("")+'</select></div>'
  +'<div><select id="e_level" style="margin-top:10px">'+["","新手","业余","经常踢","很强"].map(function(p){return '<option value="'+p+'"'+(m.level===p?" selected":"")+'>'+(p||"水平")+'</option>'}).join("")+'</select></div></div>'
  +'<input id="e_team" placeholder="主队，如：皇马" value="'+esc(m.team||"")+'" style="margin-top:10px">'
  +'<textarea id="e_bio" placeholder="介绍一下自己" style="margin-top:10px">'+esc(m.bio||"")+'</textarea>'
  +'<input id="e_style" placeholder="踢法，如：爱传球" value="'+esc(m.style||"")+'" style="margin-top:10px">'
  +'<input id="e_avail" placeholder="常有空，如：周末下午" value="'+esc(m.free_time||"")+'" style="margin-top:10px">'
  +'<div style="height:12px"></div><button class="btn-primary" onclick="saveProfile()">保存主页</button></div>';
  html+='<div class="card">'
  +'<button class="btn-ghost" onclick="logout()">退出登录</button></div>';
  return html;
}
async function saveProfile(){
  var m=me();if(!m)return;
  var patch={
    nickname:document.getElementById("e_nick").value.trim()||m.nickname,
    city:document.getElementById("e_city").value.trim(),
    position:document.getElementById("e_pos").value,
    level:document.getElementById("e_level").value,
    team:document.getElementById("e_team").value.trim(),
    bio:document.getElementById("e_bio").value.trim(),
    style:document.getElementById("e_style").value.trim(),
    free_time:document.getElementById("e_avail").value.trim()
  };
  var res=await sb.from("profiles").update(patch).eq("id",m.id).select().single();
  if(res.error){alert("保存失败，请重试。");return}
  myProfile=res.data;alert("已保存");render();
}
async function render(){
  var main=document.getElementById("main");
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.tab===tab)});
  document.getElementById("nav").classList.toggle("hidden",!sbUser);
  if(!sbUser){main.innerHTML=viewAuth();return}
  if(!dataLoaded){
    main.innerHTML='<div class="card"><p class="muted">加载中…</p></div>';
    try{await loadAll();}
    catch(e){main.innerHTML='<div class="card"><p class="muted">加载失败，请刷新重试。</p></div>';return}
  }
  updateBadge();
  if(tab==="messages")main.innerHTML=viewMessages();
  else if(tab==="friends")main.innerHTML=viewFriends();
  else if(tab==="me")main.innerHTML=viewMe();
  else main.innerHTML=viewDiscover();
}
function loadFallbackLib(cb){
  var s=document.createElement("script");
  s.src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js";
  s.onload=function(){if(window.supabase&&window.supabase.createClient){sb=window.supabase.createClient(SB_URL,SB_ANON_KEY)}cb()};
  s.onerror=function(){cb()};
  document.head.appendChild(s);
}
async function init(){
  if(!sb){await new Promise(function(res){loadFallbackLib(res)})}
  if(!sb){render();return}
  var res=await sb.auth.getSession();
  if(res.data&&res.data.session){
    sbUser=res.data.session.user;
    try{await ensureProfile();await loadAll();}
    catch(e){sbUser=null;myProfile=null;window._authMsg={kind:"err",text:e.message}}
  }
  render();
  if(sb&&sb.auth&&sb.auth.onAuthStateChange){
    sb.auth.onAuthStateChange(function(ev,session){
      if(ev==="SIGNED_IN"&&session){sbUser=session.user;afterLogin();}
      else if(ev==="SIGNED_OUT"){sbUser=null;myProfile=null;dataLoaded=false;render();}
    });
  }
}
init();
</script>
</body>
</html>
